<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POE Voice Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>POE Voice Settings</h1>
        <form id="settings-form">
            <div class="form-group">
                <label for="api-key">ElevenLabs API Key:</label>
                <input 
                    type="password" 
                    id="api-key" 
                    name="api-key" 
                    placeholder="Enter your ElevenLabs API key"
                    required
                >
                <small>
                    <a href="https://elevenlabs.io/speech-synthesis" target="_blank">Get an API key</a>
                </small>
            </div>

            <div class="form-group">
                <label for="voice-selection">Voice:</label>
                <select 
                    id="voice-selection" 
                    name="voice-selection"
                    required
                >
                    <option value="">Loading voices...</option>
                </select>
            </div>

            <div class="form-group test-container">
                <button type="button" id="test-tts" class="test-button">Test Voice</button>
                <span id="test-status"></span>
            </div>

            <div class="form-group">
                <label>
                    <input 
                        type="checkbox" 
                        id="enable-speech" 
                        name="enable-speech"
                        checked
                    >
                    Auto-read new messages
                </label>
            </div>

            <div class="form-group">
                <label for="volume">Volume:</label>
                <input 
                    type="range" 
                    id="volume" 
                    name="volume" 
                    min="0" 
                    max="1" 
                    step="0.1" 
                    value="0.7"
                >
                <span class="volume-label">70%</span>
            </div>

            <button type="submit" class="save-button">Save Settings</button>
        </form>

        <div id="status-message"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
