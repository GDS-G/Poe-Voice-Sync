<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POE Voice Settings</title>
    <link rel="stylesheet" href="popup.css">
    <!-- Add debug script first -->
    <script type="module" src="debug.js"></script>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="icons/logo.png" alt="POE Voice Settings" class="header-logo">
        </div>

        <!-- Auth Section -->
        <div id="auth-section">
            <div id="sign-in-content" style="display: none;">
                <!-- This div is now just a placeholder for the auth state -->
            </div>

            <div id="signed-in-content" style="display: none;">
                <p>Signed in as: <span id="user-email"></span></p>
                <div id="licensed-content" class="license-status-fade" style="display: none;">
                    <p class="license-active">✓ License Active</p>
                </div>
                <button id="sign-out-button" class="sign-out-button">
                    <img src="icons/SignOut.png" alt="Sign Out" class="sign-out-icon">
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="loading-indicator" style="display: none;">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <!-- Settings Form -->
        <form id="settings-form" style="display: none;">
            <div class="form-group">
                <label for="api-key">ElevenLabs API Key:</label>
                <input type="password"
                       id="api-key"
                       name="api-key"
                       placeholder="Enter your ElevenLabs API key"
                       required>
                <small>
                    <a href="https://elevenlabs.io/speech-synthesis" target="_blank">Get an API key</a>
                </small>
            </div>

            <div class="form-group">
                <label for="voice-selection">Voice:</label>
                <select id="voice-selection"
                        name="voice-selection"
                        required>
                    <option value="">Loading voices...</option>
                </select>
            </div>

            <div class="form-group test-container">
                <button type="button" id="test-tts" class="test-button">Test Voice</button>
                <span id="test-status"></span>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox"
                           id="enable-speech"
                           name="enable-speech"
                           checked>
                    Auto-read new messages
                </label>
            </div>

            <div class="form-group">
                <label for="volume">Volume:</label>
                <input type="range"
                       id="volume"
                       name="volume"
                       min="0"
                       max="1"
                       step="0.1"
                       value="0.7">
                <span class="volume-label">70%</span>
            </div>

            <button type="submit" class="btn-save">Save Settings</button>
        </form>

        <div id="status-message"></div>
    </div>

    <!-- Add module scripts -->
    <script type="module" src="popup.js"></script>
</body>
</html>
