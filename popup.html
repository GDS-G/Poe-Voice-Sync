<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POE Voice Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>POE Voice Settings</h1>

        <!-- Auth Section -->
        <div id="auth-section" class="auth-section">
            <div id="sign-in-content" style="display: none;">
                <p>Please sign in with Google to use this extension:</p>
                <button id="sign-in-button" class="btn-primary">Sign in with Google</button>
            </div>

            <div id="signed-in-content" style="display: none;">
                <p>Signed in as: <span id="user-email"></span></p>
                <button id="sign-out-button" class="btn-secondary">Sign Out</button>
            </div>
        </div>

        <!-- License Status -->
        <div id="license-section" class="license-section" style="display: none;">
            <div id="unlicensed-content">
                <p>Purchase a license to activate the extension:</p>
                <div class="price-display">$19.99 USD</div>
                <button id="purchase-button" class="btn-primary">Purchase License</button>
            </div>
            <div id="licensed-content" style="display: none;">
                <p class="license-active">✓ License Active</p>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="loading-indicator" style="display: none;">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <!-- Settings Form -->
        <form id="settings-form" style="display: none;">
            <div class="form-group">
                <label for="api-key">ElevenLabs API Key:</label>
                <input type="password"
                       id="api-key"
                       name="api-key"
                       placeholder="Enter your ElevenLabs API key"
                       required>
                <small>
                    <a href="https://elevenlabs.io/speech-synthesis" target="_blank">Get an API key</a>
                </small>
            </div>

            <div class="form-group">
                <label for="voice-selection">Voice:</label>
                <select id="voice-selection"
                        name="voice-selection"
                        required>
                    <option value="">Loading voices...</option>
                </select>
            </div>

            <div class="form-group test-container">
                <button type="button" id="test-tts" class="test-button">Test Voice</button>
                <span id="test-status"></span>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox"
                           id="enable-speech"
                           name="enable-speech"
                           checked>
                    Auto-read new messages
                </label>
            </div>

            <div class="form-group">
                <label for="volume">Volume:</label>
                <input type="range"
                       id="volume"
                       name="volume"
                       min="0"
                       max="1"
                       step="0.1"
                       value="0.7">
                <span class="volume-label">70%</span>
            </div>

            <button type="submit" class="btn-save">Save Settings</button>
        </form>

        <div id="status-message"></div>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
