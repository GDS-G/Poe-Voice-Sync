<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POE Voice Settings</title>
    <link rel="stylesheet" href="popup.css">
    <!-- Add debug script first -->
    <script type="module" src="debug.js"></script>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="icons/logo.png" alt="POE Voice Settings" class="header-logo">
        </div>

        <!-- Auth Section -->
        <div id="auth-section">
            <div id="sign-in-content" style="display: none;">
                <button id="sign-in-button" class="gsi-material-button">
                    <div class="gsi-material-button-state"></div>
                    <div class="gsi-material-button-content-wrapper">
                        <div class="gsi-material-button-icon">
                            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                                <path fill="none" d="M0 0h48v48H0z"></path>
                            </svg>
                        </div>
                        <span class="gsi-material-button-contents">Sign in with Google</span>
                        <span style="display: none;">Sign in with Google</span>
                    </div>
                </button>
            </div>

            <div id="signed-in-content" style="display: none;">
                <p>Signed in as: <span id="user-email"></span></p>
                <div id="licensed-content" class="license-status-fade" style="display: none;">
                    <p class="license-active">✓ License Active</p>
                </div>
                <button id="sign-out-button" class="sign-out-button">
                    <img src="icons/SignOut.png" alt="Sign Out" class="sign-out-icon">
                </button>
            </div>
        </div>

        <!-- License Status -->
        <div id="license-section" style="display: none;">
            <div id="unlicensed-content">
                <p class="price-display">Activate Extension for $19.99</p>
                <button id="purchase-button" class="paypal-button">
                    <img src="icons/paypal.png" alt="Pay with PayPal" class="paypal-button-image">
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="loading-indicator" style="display: none;">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <!-- Settings Form -->
        <form id="settings-form" style="display: none;">
            <div class="form-group">
                <label for="api-key">ElevenLabs API Key:</label>
                <input type="password"
                       id="api-key"
                       name="api-key"
                       placeholder="Enter your ElevenLabs API key"
                       required>
                <small>
                    <a href="https://elevenlabs.io/speech-synthesis" target="_blank">Get an API key</a>
                </small>
            </div>

            <div class="form-group">
                <label for="voice-selection">Voice:</label>
                <select id="voice-selection"
                        name="voice-selection"
                        required>
                    <option value="">Loading voices...</option>
                </select>
            </div>

            <div class="form-group test-container">
                <button type="button" id="test-tts" class="test-button">Test Voice</button>
                <span id="test-status"></span>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox"
                           id="enable-speech"
                           name="enable-speech"
                           checked>
                    Auto-read new messages
                </label>
            </div>

            <div class="form-group">
                <label for="volume">Volume:</label>
                <input type="range"
                       id="volume"
                       name="volume"
                       min="0"
                       max="1"
                       step="0.1"
                       value="0.7">
                <span class="volume-label">70%</span>
            </div>

            <button type="submit" class="btn-save">Save Settings</button>
        </form>

        <div id="status-message"></div>
    </div>

    <!-- Add module scripts -->
    <script type="module" src="popup.js"></script>
</body>
</html>
