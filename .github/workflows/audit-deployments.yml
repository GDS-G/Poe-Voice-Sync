name: Audit public deployments

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/audit-deployments.yml

permissions:
  contents: read

jobs:
  public-store-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check public store and service endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local label="$1"
            local url="$2"
            local result
            result="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code} %{url_effective}' "$url")"
            echo "$label: $result"
            test "${result%% *}" -ge 200
            test "${result%% *}" -lt 400
          }

          check_url "Chrome Web Store listing" "https://chromewebstore.google.com/detail/llcfagalhmcgnichkhlpmihpidnlfofc"
          check_url "Chrome published CRX" "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=140.0&acceptformat=crx3&x=id%3Dllcfagalhmcgnichkhlpmihpidnlfofc%26uc"
          check_url "Edge Add-ons listing" "https://microsoftedge.microsoft.com/addons/detail/odmiifnnkljeofhjigaadempngmkapic"
          check_url "Edge published CRX" "https://edge.microsoft.com/extensionwebstorebase/v1/crx?response=redirect&x=id%3Dodmiifnnkljeofhjigaadempngmkapic%26installsource%3Dondemand%26uc"
          check_url "Firefox Add-ons API" "https://addons.mozilla.org/api/v5/addons/addon/poe-voice-sync/"
          check_url "GitHub Pages checkout" "https://gds-g.github.io/Poe-Voice-Sync/payment/payment.html"

      - name: Report Firefox public version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://addons.mozilla.org/api/v5/addons/addon/poe-voice-sync/"
          with urllib.request.urlopen(url) as response:
              data = json.load(response)

          current = data.get("current_version") or {}
          print("Firefox slug:", data.get("slug"))
          print("Firefox version:", current.get("version"))
          print("Firefox reviewed:", current.get("reviewed"))
          print("Firefox URL:", data.get("url"))
          if data.get("slug") != "poe-voice-sync" or not current.get("version"):
              raise SystemExit("Firefox public release metadata is missing")
          PY
