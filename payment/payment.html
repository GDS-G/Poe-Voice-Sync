<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POE Voice Sync - Payment</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
        }

        .logo-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .logo {
            max-width: 200px;
            height: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        #paypal-button-container {
            width: 100%;
            max-width: 500px;
            min-height: 200px;
        }

        #result-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }

        .error {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .success {
            color: #28a745;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img id="extension-logo" class="logo" src="logo.png" alt="POE Voice Sync">
    </div>
    <div class="price">Activate Extension for $19.99 USD</div>
    <div id="paypal-button-container"></div>
    <p id="result-message"></p>

    <!-- Load PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=AWXwlfbfBOYSDikaxv7FchKUDAcTo7ObFB-qT3GEraxUnu4F6YWQPo3Y4sSAwXAht8syBpNFFV2HlvYh&currency=USD&components=buttons"
            data-namespace="paypal"
            async></script>

    <!-- Load app.js only after PayPal script -->
    <script>
        // Function to load app.js
        function loadAppJs() {
            const script = document.createElement('script');
            script.src = 'app.js';
            script.onerror = function(error) {
                console.error('Error loading app.js:', error);
                document.getElementById('result-message').innerHTML = 'Error loading payment system. Please try again.';
                document.getElementById('result-message').className = 'error';
            };
            document.body.appendChild(script);
        }

        // Wait for PayPal to be available
        let attempts = 0;
        const maxAttempts = 10;
        
        function checkPayPal() {
            if (window.paypal) {
                loadAppJs();
            } else if (attempts < maxAttempts) {
                attempts++;
                setTimeout(checkPayPal, 500);
            } else {
                document.getElementById('result-message').innerHTML = 'Error loading payment system. Please try again.';
                document.getElementById('result-message').className = 'error';
            }
        }

        // Start checking for PayPal
        checkPayPal();
    </script>
</body>
</html>
