<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POE Voice Sync - Payment</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
        }

        .logo-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .logo {
            max-width: 200px;
            height: auto;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        #paypal-button-container {
            width: 100%;
            max-width: 500px;
            min-height: 200px;
        }

        #result-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }

        .error {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .success {
            color: #28a745;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
    </style>
    <script>
        // Get extension ID and set it as a global variable
        const urlParams = new URLSearchParams(window.location.search);
        window.extId = urlParams.get('extId');
    </script>
</head>
<body>
    <div class="logo-container">
        <picture>
            <!-- Fallback to a default image if extension path fails -->
            <source srcset="" id="extension-source">
            <img src="https://gds-g.github.io/Poe-Voice-Sync/logo.png" id="extension-logo" class="logo" alt="POE Voice Sync">
        </picture>
    </div>
    <div class="price">Activate Extension for $19.99 USD</div>
    <div id="paypal-button-container"></div>
    <p id="result-message"></p>

    <script>
        // Try to set extension logo source
        if (window.extId) {
            const extensionSource = document.getElementById('extension-source');
            extensionSource.srcset = `chrome-extension://${window.extId}/icons/logo.png`;
            // Add error handling for the extension logo
            const extensionLogo = document.getElementById('extension-logo');
            extensionLogo.onerror = function() {
                // On error, it will automatically fall back to the default image
                console.log('Extension logo failed to load, using default');
            };
        }
    </script>

    <!-- Load PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=AWXwlfbfBOYSDikaxv7FchKUDAcTo7ObFB-qT3GEraxUnu4F6YWQPo3Y4sSAwXAht8syBpNFFV2HlvYh&currency=USD&components=buttons"
            data-namespace="paypal"></script>

    <!-- Load app.js -->
    <script src="app.js"></script>
</body>
</html>
