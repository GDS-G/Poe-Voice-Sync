<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POE Voice Sync - Payment</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
        }

        .logo-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .logo {
            max-width: 200px;
            height: auto;
        }

        .price {
            font-size: 24px;
            font-weight: 500;
            margin: 20px 0;
            color: #2c3e50;
        }

        #paypal-button-container {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }

        #result-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="chrome-extension://__MSG_@@extension_id__/icons/logo.png" alt="POE Voice Sync" class="logo">
    </div>
    <div class="price">Activate Extension for $19.99 USD</div>
    <div id="paypal-button-container"></div>
    <p id="result-message"></p>

    <script src="https://www.paypal.com/sdk/js?client-id=AWXwlfbfBOYSDikaxv7FchKUDAcTo7ObFB-qT3GEraxUnu4F6YWQPo3Y4sSAwXAht8syBpNFFV2HlvYh&currency=USD&components=buttons&enable-funding=venmo,paylater,card"
            data-sdk-integration-source="developer-studio"></script>
    <script src="app.js"></script>
</body>
</html>
