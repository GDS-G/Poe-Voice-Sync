<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Poe Voice Sync promotional image</title>
  <desc id="desc">Poe chatbot responses read aloud with ElevenLabs or Hume voices.</desc>
  <defs>
    <linearGradient id="back" x1="90" y1="34" x2="1180" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11142f"/>
      <stop offset=".55" stop-color="#4034a4"/>
      <stop offset="1" stop-color="#b82fcf"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="130" x2="430" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#48d7ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#090b20" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#back)"/>
  <circle cx="1120" cy="90" r="270" fill="#48d7ff" opacity=".08"/>
  <circle cx="210" cy="740" r="260" fill="#ff4fd8" opacity=".08"/>

  <g transform="translate(72 64)">
    <rect width="68" height="68" rx="17" fill="#fff" opacity=".12"/>
    <path d="M14 23c0-5 4-9 9-9h24c5 0 9 4 9 9v18c0 5-4 9-9 9H33L22 60V50c-4.6-.5-8-4.4-8-9V23Z" fill="#fff"/>
    <rect x="21" y="22" width="29" height="20" rx="6" fill="#171a38"/>
    <circle cx="30" cy="32" r="3" fill="#fff"/>
    <circle cx="41" cy="32" r="3" fill="#fff"/>
    <path d="M35.5 22v-5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="35.5" cy="14" r="3" fill="#48d7ff"/>
  </g>
  <text x="160" y="110" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Poe Voice Sync</text>

  <text x="72" y="226" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800">
    <tspan x="72" dy="0">Give every Poe</tspan>
    <tspan x="72" dy="72">response a voice.</tspan>
  </text>
  <text x="72" y="408" fill="#dfe4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">
    <tspan x="72" dy="0">Listen automatically or click the voice button</tspan>
    <tspan x="72" dy="37">beside any response—new or old.</tspan>
  </text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#fff">
    <g transform="translate(72 510)">
      <circle cx="13" cy="13" r="13" fill="url(#accent)"/><path d="m7 13 4 4 8-9" fill="none" stroke="#11142f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="20">ElevenLabs and Hume voices</text>
    </g>
    <g transform="translate(72 563)">
      <circle cx="13" cy="13" r="13" fill="url(#accent)"/><path d="m7 13 4 4 8-9" fill="none" stroke="#11142f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="20">Personalized voices shown first</text>
    </g>
    <g transform="translate(72 616)">
      <circle cx="13" cy="13" r="13" fill="url(#accent)"/><path d="m7 13 4 4 8-9" fill="none" stroke="#11142f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="20">Auto-read only new chatbot replies</text>
    </g>
  </g>

  <g transform="translate(670 92)" filter="url(#cardShadow)">
    <rect width="530" height="616" rx="24" fill="#f8f9fd"/>
    <rect width="530" height="56" rx="24" fill="#eef0f7"/>
    <rect y="32" width="530" height="24" fill="#eef0f7"/>
    <circle cx="28" cy="28" r="7" fill="#ff6b6b"/><circle cx="52" cy="28" r="7" fill="#ffd166"/><circle cx="76" cy="28" r="7" fill="#49d17d"/>
    <rect x="106" y="17" width="350" height="22" rx="11" fill="#fff"/>
    <text x="124" y="33" fill="#667085" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">poe.com/chat</text>

    <text x="34" y="98" fill="#161a35" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Poe conversation</text>
    <rect x="34" y="124" width="462" height="112" rx="18" fill="#fff" stroke="#e0e4ee"/>
    <circle cx="62" cy="155" r="14" fill="#161a35"/>
    <text x="86" y="160" fill="#161a35" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Assistant</text>
    <text x="58" y="194" fill="#40465f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Here is the answer—ready to listen while you work.</text>
    <circle cx="464" cy="199" r="21" fill="#4b3bc4"/>
    <path d="M454 196h6l8-7v20l-8-7h-6z" fill="#fff"/>
    <path d="M472 193c4 4 4 10 0 14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

    <g transform="translate(108 260)">
      <rect width="340" height="320" rx="18" fill="#fff" stroke="#d9dfeb"/>
      <g transform="translate(105 20)">
        <rect width="38" height="38" rx="10" fill="#4b3bc4"/>
        <path d="M8 14c0-3 2-5 5-5h14c3 0 5 2 5 5v10c0 3-2 5-5 5h-8l-7 6v-6c-2-.5-4-2-4-5z" fill="#fff"/>
        <circle cx="17" cy="19" r="2" fill="#171a38"/><circle cx="24" cy="19" r="2" fill="#171a38"/>
      </g>
      <text x="151" y="46" fill="#161a35" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Poe Voice Sync</text>
      <text x="24" y="92" fill="#536174" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Voice provider</text>
      <rect x="24" y="102" width="292" height="38" rx="7" fill="#fafbfe" stroke="#ccd3df"/>
      <text x="38" y="127" fill="#161a35" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Hume</text>
      <text x="24" y="170" fill="#536174" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Voice</text>
      <rect x="24" y="180" width="292" height="38" rx="7" fill="#fafbfe" stroke="#ccd3df"/>
      <text x="38" y="205" fill="#161a35" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">My personalized voice</text>
      <rect x="24" y="240" width="17" height="17" rx="4" fill="#4b3bc4"/>
      <path d="m28 248 4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="254" fill="#161a35" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Auto-read new messages</text>
      <rect x="24" y="278" width="292" height="30" rx="15" fill="#5865f2"/>
      <text x="170" y="298" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Support &amp; feedback on Discord</text>
    </g>
  </g>

  <text x="72" y="754" fill="#dfe4ff" opacity=".78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Requires the user’s own supported voice-provider account and API key. Not affiliated with Poe, ElevenLabs, or Hume.</text>
</svg>
